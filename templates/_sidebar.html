<aside class="app-sidebar" id="appSidebar" aria-label="Navegação principal">
    <div class="sidebar-header">
        <a href="{{ url_for('pedidos.dashboard') }}" class="sidebar-brand" aria-label="CNP Compras - Dashboard">
            <span class="sidebar-brand-mark">CNP</span>
            <span class="sidebar-brand-text">
                <strong>CNP Compras</strong>
                <small>Controle de pedidos</small>
            </span>
        </a>

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Recolher menu"
            aria-expanded="true"
            title="Recolher menu"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 6l-6 6 6 6"></path>
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menu">
        <span class="sidebar-section-label">Navegação</span>

        {# Para adicionar um item: crie outro <a> seguindo este mesmo padrão. #}
        <a
            href="{{ url_for('pedidos.dashboard') }}"
            class="sidebar-item {% if request.endpoint == 'pedidos.dashboard' %}is-active{% endif %}"
            {% if request.endpoint == 'pedidos.dashboard' %}aria-current="page"{% endif %}
            title="Dashboard"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-8h-6v8zm0-16v4h6V4h-6z"></path>
            </svg>
            <span>Dashboard</span>
        </a>

        <button
            type="button"
            class="sidebar-item sidebar-action"
            onclick="abrirModalNovo()"
            title="Novo pedido"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>Novo pedido</span>
        </button>

        <a
            href="{{ url_for('pedidos.lixeira') }}"
            class="sidebar-item"
            title="Lixeira"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path>
            </svg>
            <span>Lixeira</span>
        </a>
		
    </nav>

    <div class="sidebar-footer">
    <div class="sidebar-signature">
    <div class="sidebar-signature-divider"></div>

    <span class="sidebar-signature-title">
        CNP • Controle de Pedidos
    </span>

    <span class="sidebar-signature-version">
        v{{ app_version }}
    </span>
	

    <a
        href="https://github.com/gabriel-s-justino"
        class="sidebar-github"
        target="_blank"
        rel="noopener noreferrer"
        title="GitHub de Gabriel S Justino"
        aria-label="GitHub de Gabriel S Justino"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.58 2 12.24c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.48v-1.7c-2.78.62-3.37-1.2-3.37-1.2-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .08 1.53 1.06 1.53 1.06.9 1.58 2.36 1.12 2.94.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.15-4.56-5.09 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05A9.18 9.18 0 0 1 12 7.18c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.95-2.35 4.82-4.58 5.08.36.32.68.94.68 1.9v2.84c0 .27.18.59.69.48A10.26 10.26 0 0 0 22 12.24C22 6.58 17.52 2 12 2z"></path>
        </svg>

        <span>Gabriel S Justino</span>
    </a>

    <small>© 2026 - {{ current_year }}</small>

    <div class="sidebar-signature-divider"></div>
</div>
    <a
        href="{{ url_for('login_bp.logout') }}"
        class="sidebar-item sidebar-logout"
        title="Sair"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17l5-5-5-5M15 12H3M21 4v16"></path>
        </svg>

        <span>Sair</span>
    </a>
</div>
</aside>

<button
    type="button"
    class="sidebar-mobile-toggle"
    id="sidebarMobileToggle"
    aria-label="Abrir menu"
    aria-expanded="false"
    aria-controls="appSidebar"
>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
</button>

<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
